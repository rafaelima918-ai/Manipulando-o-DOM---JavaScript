<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Manipulação do DOM</title>
</head>

<body>
    <h1>Manipulação do DOM</h1>
    <div class="container">
        <div class="block1">
            <h2>Saudação</h2>
            <p id="pg1">Bem-vindo ao meu primeiro projeto</p>
            <button id="bnt1">Alterar saudação</button>
        </div>
        <div class="block2">
            <h2>Mudança de cores</h2>
            <p id="pg2">Aprendendo a manipular estilos com JavaScript</p>
            <button id="bnt2">Mudar cor de texto</button>
        </div>
        <div class="block3">
            <h2>Contador de cliques</h2>
            <p id="pg3">Cliques realizados: 0</p>
            <button id="bnt3">Contar cliques</button>
        </div>
        <div class="block4">
            <h2>Mensagem dinamica</h2>
            <p id="pg4">Clique pra descobrir uma mensagem</p>
            <button id="bnt4">Mostrar mensagem</button>
        </div>

        <div class="block5">
            <h2>Alterar botão</h2>
            <button id="bnt5">Alterar botões</button>
        </div>
    </div>


</body>
<script src="script.js"></script>
